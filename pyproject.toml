[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "code-reviewer"
version = "0.1.0"
description = "Локальный AI код-ревьюер с картой репозитория и графом зависимостей"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "pydantic>=2.10",
]

[project.optional-dependencies]
treesitter = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.13",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]
build = [
    "pyinstaller>=6.15",
]

[project.scripts]
code-reviewer = "code_reviewer.cli.app:run"
cr = "code_reviewer.cli.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/code_reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tree_sitter", "tree_sitter_language_pack"]
ignore_missing_imports = true
